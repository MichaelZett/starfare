# Game description read by a host (games-platform): classpath*:games/*/game.properties.
# Routes live under /starfare, texts under games/starfare/i18n, migrations under
# games/starfare/migrations (added by gradle/game-module.gradle).
key=starfare
basePackage=de.zettsystems.starfare
# Agreed exception: Starfare keeps its tables and history in the public schema.
schema=public
defaultStage=PUBLIC
publicPaths=

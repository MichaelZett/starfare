# Game description read by a host (games-platform): classpath*:games/*/game.properties.
# Routes live under /starfare, texts under games/starfare/i18n, migrations under
# games/starfare/migrations (added by gradle/game-module.gradle).
key=starfare
basePackage=de.zettsystems.starfare
# Agreed exception: Starfare keeps its tables and history in the public schema.
schema=public
defaultStage=PUBLIC
publicPaths=
# Look in the platform frame (M9): dark header, Starfare blue, the favicon as game icon.
scheme=dark
accent=#58a6ff
icon=icons/starfare.svg
# Game navigation in the platform frame; texts game.navigation.<id> in games/starfare/i18n.
navigation=lobby:/starfare, statistics:/starfare/statistics, archive:/starfare/archive
# The map fills the screen: the frame shows only a slim strip with logo and the way back.
fullscreenPaths=/starfare/map/

map.legendText=G: Garnison · P: Produktion · ~: geschätzt · blasse Systeme: Aufklärung ohne aktuelle Sicht. Durchgezogene Linien: Flotten · gestrichelt: vorgemerkte Befehle · violett gestrichelt: Produktionsverlegungen. ⚔: Schlacht noch nicht angesehen · !: Engpass in der Wirtschaft · Zahl am Systemrand: freie Schiffe · R14 links am System: Ankunftsrunde beim gewählten Ziel (✓ gleichzeitig, ⏸ zu früh). Ziehen verschiebt die Karte, das Mausrad zoomt.
map.legendTextTouch=G: Garnison · P: Produktion · ~: geschätzt · blasse Systeme: Aufklärung ohne aktuelle Sicht. Durchgezogene Linien: Flotten · gestrichelt: vorgemerkte Befehle · violett gestrichelt: Produktionsverlegungen. ⚔: Schlacht noch nicht angesehen · !: Engpass in der Wirtschaft · Zahl am Systemrand: freie Schiffe · R14 links am System: Ankunftsrunde beim gewählten Ziel (✓ gleichzeitig, ⏸ zu früh). Wischen verschiebt die Karte, zwei Finger oder die Lupen zoomen. Ein Tipp auf ein System öffnet seine Details.

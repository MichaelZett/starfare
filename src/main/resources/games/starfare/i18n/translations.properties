privacy.data=Starfare verarbeitet Kontodaten des Anmeldedienstes, den gewählten Anzeigenamen, Partie- und Zugdaten sowie Nachrichten in einer Partie. E-Mail-Adresse und Passwort werden ausschließlich vom Anmeldedienst verarbeitet.
privacy.purposeTitle=Zweck und Speicherdauer
privacy.purpose=Die Daten dienen dem Betrieb der Partien, der Anzeige von Ergebnissen und der Kommunikation innerhalb einer Partie. Direktnachrichten und Partie-Chats werden nach 365 Tagen entfernt. Beendete Partien und ihre Statistik bleiben für die Nachbetrachtung gespeichert.
privacy.rightsTitle=Deine Rechte
privacy.rights=Du kannst dein Konto einschließlich der beim Anmeldedienst gespeicherten Kontodaten selbst löschen. Bereits abgeschlossene Partien bleiben als Spielhistorie erhalten; der personenbezogene Anzeigename wird dort nicht weiter mit einem Konto verknüpft.

  <!-- Eighties horizon -->
  <rect y="146" width="720" height="34" fill="#100c33"/>
  <rect y="138" width="720" height="10" fill="url(#horizon)"/>
  <g stroke="#7c70da" stroke-opacity=".55" fill="none">
    <path d="M0 146H720M0 154H720M0 165H720"/>
    <path d="M360 146L250 180M420 146L360 180M480 146L470 180M540 146L580 180M600 146L690 180M660 146L800 180M300 146L140 180"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#0e0c2e"/>
      <stop offset=".55" stop-color="#231a63"/>
      <stop offset="1" stop-color="#40318d"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c70da" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c70da" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="180" fill="url(#sky)"/>
  <g shape-rendering="crispEdges">
    <!-- Pixel stars -->
    <g fill="#a9b8ff">
      <rect x="318" y="22" width="4" height="4"/><rect x="384" y="58" width="4" height="4"/>
      <rect x="436" y="16" width="4" height="4"/><rect x="498" y="74" width="4" height="4"/>
      <rect x="566" y="30" width="4" height="4"/><rect x="694" y="20" width="4" height="4"/>
      <rect x="350" y="92" width="4" height="4"/><rect x="646" y="84" width="4" height="4"/>
    </g>
    <g fill="#fff">
      <rect x="412" y="40" width="4" height="4"/><rect x="618" y="12" width="4" height="4"/>
      <rect x="532" y="52" width="4" height="4"/>
    </g>
    <!-- Pixel planet in the C64 palette -->
    <g fill="#6c5eb5">
      <rect x="600" y="44" width="48" height="8"/><rect x="584" y="52" width="80" height="8"/>
      <rect x="576" y="60" width="96" height="48"/><rect x="584" y="108" width="80" height="8"/>
      <rect x="600" y="116" width="48" height="8"/>
    </g>
    <g fill="#a59af0">
      <rect x="600" y="52" width="32" height="8"/><rect x="592" y="60" width="24" height="8"/>
      <rect x="584" y="68" width="16" height="16"/><rect x="640" y="84" width="24" height="8"/>
      <rect x="616" y="100" width="32" height="8"/>
    </g>
    <g fill="#352879">
      <rect x="648" y="68" width="16" height="8"/><rect x="608" y="84" width="16" height="8"/>
      <rect x="592" y="100" width="16" height="8"/><rect x="632" y="60" width="8" height="8"/>
    </g>
    <!-- Fleet: three blocky raiders -->
    <g id="raider" fill="#e6e8ff">
      <rect x="452" y="108" width="36" height="6"/><rect x="464" y="102" width="30" height="6"/>
      <rect x="464" y="114" width="30" height="6"/><rect x="476" y="96" width="12" height="6"/>
      <rect x="476" y="120" width="12" height="6"/><rect x="488" y="108" width="12" height="6"/>
      <rect x="446" y="102" width="6" height="18" fill="#f0c14b"/>
      <rect x="434" y="108" width="12" height="6" fill="#d55e00"/>
    </g>
    <g fill="#c7cbf5">
      <rect x="388" y="66" width="24" height="4"/><rect x="396" y="62" width="20" height="4"/>
      <rect x="396" y="70" width="20" height="4"/><rect x="416" y="66" width="8" height="4"/>
      <rect x="382" y="62" width="6" height="12" fill="#f0c14b"/>
    </g>
    <g fill="#c7cbf5">
      <rect x="340" y="124" width="24" height="4"/><rect x="348" y="120" width="20" height="4"/>
      <rect x="348" y="128" width="20" height="4"/><rect x="368" y="124" width="8" height="4"/>
      <rect x="334" y="120" width="6" height="12" fill="#f0c14b"/>
    </g>

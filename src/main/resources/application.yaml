server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful

vaadin:
  productionMode: true
  allowed-packages: de.zettsystems.starfare,de.zettsystems.identity

spring:
  application:
    name: starfare
  docker:
    compose:
      enabled: true  # set to false in production (DB is already running there)
  datasource:
    hikari:
      # https://vladmihalcea.com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/
      # in combination with jpa.properties.hibernate.connection.provider_disables_autocommit: true
      auto-commit: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    # Nur die eigenen Migrationen. Der Identity-Baustein (seit 0.8.0) migriert
    # sein eigenes Schema `identity` mit eigener History selbst, vor diesem
    # Lauf — kein out-of-order und kein fremder Ablageort mehr. Beim ersten
    # Start mit 0.8.0 zieht er die auth_*-Tabellen einmalig nach `identity` um.
    locations: classpath:db/migration

zs:
  identity:
    from-name: Starfare
    # Spieler waehlen einen oeffentlichen Namen; Vor-/Nachname werden nicht erhoben.
    name-mode: DISPLAY_NAME
    base-url: http://localhost:8080

starfare:
  game:
    archive-cleanup:
      enabled: false
      retention: P90D
    inactivity-timeout: 5m
    single-player-unload-after: 30m
    inactivity-check-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full
  health:
    mail:
      enabled: false

logging:
  level:
    org:
      atmosphere: warn

server:
  port: 8110
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful

vaadin:
  productionMode: true
  allowed-packages: de.zettsystems.starfare

spring:
  application:
    name: starfare
  docker:
    compose:
      enabled: true  # set to false in production (DB is already running there)
  datasource:
    hikari:
      # https://vladmihalcea.com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/
      # in combination with jpa.properties.hibernate.connection.provider_disables_autocommit: true
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    # Nur die eigenen Migrationen. Das Schema `identity` des früheren
    # Identity-Bausteins bleibt in alten Datenbanken liegen; niemand liest es mehr.
    locations: classpath:db/migration

starfare:
  timing:
    # Round resolutions at least this long are logged at WARN (RulesetTurnEngine).
    # 0 disables. Page timings and query counts come from the host (/admin/timings).
    slow-round-ms: 1000
  legal:
    operator-name: ${STARFARE_LEGAL_OPERATOR_NAME:}
    postal-address: ${STARFARE_LEGAL_POSTAL_ADDRESS:}
    contact-email: ${STARFARE_LEGAL_CONTACT_EMAIL:}
  game:
    single-player-unload-after: 30m
    round-check-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # The public answer carries the status only; details are for the administrator.
      show-details: when-authorized
      roles: SYSTEM_ADMIN
      status:
        # A status missing here silently drops out of the overall result.
        # degraded = the game runs, something secondary is missing: HTTP 200.
        # down/out-of-service = real outage: HTTP 503.
        order: down,out-of-service,degraded,up,unknown
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full

logging:
  level:
    org:
      atmosphere: warn

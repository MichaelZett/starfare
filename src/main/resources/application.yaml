server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful

vaadin:
  productionMode: true
  allowed-packages: de.zettsystems.starfare,de.zettsystems.identity

spring:
  application:
    name: starfare
  docker:
    compose:
      enabled: true  # set to false in production (DB is already running there)
  datasource:
    url: jdbc:postgresql://localhost:5432/starfare
    username: starfare
    password: starfare
    hikari:
      # https://vladmihalcea:com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/
      # in combination with jpa:properties:hibernate:connection:provider_disables_autocommit: true
      auto-commit: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    # Nur die eigenen Migrationen (V2_x). Der Identity-Baustein haengt seinen
    # Ablageort (classpath:db/identity, V1_x) per Auto-Konfiguration selbst an.
    locations: classpath:db/migration
    # Neue Baustein-Migrationen (V1_x) sind niedriger nummeriert als bereits
    # angewendete App-Migrationen; ohne out-of-order lehnt Flyway sie ab.
    out-of-order: true

zs:
  identity:
    from-name: Starfare
    # Spieler waehlen einen oeffentlichen Namen; Vor-/Nachname werden nicht erhoben.
    name-mode: DISPLAY_NAME
    base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full
  health:
    mail:
      enabled: false

logging:
  level:
    org:
      atmosphere: warn

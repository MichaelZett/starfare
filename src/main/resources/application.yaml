server:
  port: 8110
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful

vaadin:
  productionMode: true
  allowed-packages: de.zettsystems.starfare,de.zettsystems.identity

spring:
  application:
    name: starfare
  docker:
    compose:
      enabled: true  # set to false in production (DB is already running there)
  datasource:
    hikari:
      # https://vladmihalcea.com/why-you-should-always-use-hibernate-connection-provider_disables_autocommit-for-resource-local-jpa-transactions/
      # in combination with jpa.properties.hibernate.connection.provider_disables_autocommit: true
      auto-commit: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # JavaMail waits forever by default: a server that stops answering would
      # block a delivery and keep the health check from ever reporting it.
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
        # SqlStatementRecorder (PageTiming) registers itself: SqlStatementRecorderConfiguration.
    open-in-view: false
  flyway:
    enabled: true
    # Nur die eigenen Migrationen. Der Identity-Baustein (seit 0.8.0) migriert
    # sein eigenes Schema `identity` mit eigener History selbst, vor diesem
    # Lauf — kein out-of-order und kein fremder Ablageort mehr. Beim ersten
    # Start mit 0.8.0 zieht er die auth_*-Tabellen einmalig nach `identity` um.
    locations: classpath:db/migration

zs:
  identity:
    from-name: Starfare
    # Spieler waehlen einen oeffentlichen Namen; Vor-/Nachname werden nicht erhoben.
    name-mode: DISPLAY_NAME
    base-url: http://localhost:8110
    # A dead mail server is DEGRADED, not DOWN: replaces Spring Boot's mail check.
    mail-health:
      enabled: true

starfare:
  timing:
    # Page builds/UI actions and round resolutions at least this long are logged
    # at WARN (PageTiming, RulesetTurnEngine; prod-langsam.sh). 0 disables.
    slow-page-ms: 500
    slow-round-ms: 1000
    # A faster request is still logged ("Viele Abfragen") from this many statements
    # or when one statement runs three times or more.
    many-statements: 20
  legal:
    operator-name: ${STARFARE_LEGAL_OPERATOR_NAME:}
    postal-address: ${STARFARE_LEGAL_POSTAL_ADDRESS:}
    contact-email: ${STARFARE_LEGAL_CONTACT_EMAIL:}
  game:
    archive-cleanup:
      enabled: false
      retention: P90D
    single-player-unload-after: 30m
    round-check-interval: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # The public answer carries the status only; details are for the administrator.
      show-details: when-authorized
      roles: SYSTEM_ADMIN
      status:
        # A status missing here silently drops out of the overall result.
        # degraded = the game runs, something secondary is missing: HTTP 200.
        # down/out-of-service = real outage: HTTP 503.
        order: down,out-of-service,degraded,up,unknown
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full

logging:
  level:
    org:
      atmosphere: warn

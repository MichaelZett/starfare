account.navigation=My account
privacy.data=Starfare processes account data from the identity service, your display name, game and turn data, and in-game messages. Email addresses and passwords are processed exclusively by the identity service.
privacy.purposeTitle=Purpose and retention
privacy.purpose=Data is used to operate games, display results and enable communication. Direct messages and game chats are removed after 365 days. Completed games and their statistics remain available for review.
privacy.rightsTitle=Your rights
privacy.rights=You can delete your account and the account data stored by the identity service. Completed games remain as game history; the personal display name is no longer linked to an account.

system.star.red=Red dwarf · M
system.star.red.description=Small, faint main-sequence star. Surface roughly 2,400–3,700 K; very long-lived. Red dwarfs can produce powerful flares.
system.star.orange=Orange star · K
system.star.orange.description=Cooler and fainter than the Sun. Surface roughly 3,700–5,200 K; consumes its fuel more slowly than a Sun-like star.
system.star.yellow=Yellow star · G
system.star.yellow.description=Sun-like main-sequence star. Surface roughly 5,200–6,000 K. Yellow is a schematic colour: sunlight in space appears almost white.
system.star.yellow_white=Yellow-white star · F
system.star.yellow_white.description=Hotter and usually more luminous than the Sun. Surface roughly 6,000–7,500 K; shorter-lived than Sun-like stars.
system.star.white=White star · A
system.star.white.description=Hot, luminous main-sequence star. Surface roughly 7,500–10,000 K. Not a white dwarf: white dwarfs are compact stellar remnants.
system.body.rocky=Rocky planet
system.body.rocky.description=Solid surface of rock and metal. Atmosphere and temperature can vary widely; a rocky planet is not automatically habitable.
system.body.super_earth=Super-Earth
system.body.super_earth.description=Larger or more massive than Earth, smaller than Neptune. This is a size class, not a second Earth: rock and a thick gaseous envelope are possible.
system.body.gas_giant=Gas giant
system.body.gas_giant.description=Large planet with a deep hydrogen and helium envelope and no solid outer surface. Very close orbits are also possible.
system.body.ice_giant=Ice giant
system.body.ice_giant.description=Neptune-like planet with a deep atmosphere and an interior rich in heavier substances such as water and ammonia. Not a frozen rocky ball.
system.body.dwarf=Dwarf planet
system.body.dwarf.description=Small, roughly spherical body made of rock and possibly ice. Unlike a planet, it has not cleared its orbital neighbourhood.
system.body.asteroids=Asteroid belt
system.body.asteroids.description=Many small bodies on similar orbits. The dots are greatly enlarged; a real belt is mostly empty space.

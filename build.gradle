import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import net.ltgt.gradle.errorprone.CheckSeverity

import java.util.Locale

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${dependencyManagementVersion}"
    id 'com.vaadin' version "${vaadinVersion}"
    id 'com.github.spotbugs' version "${spotbugsPluginVersion}"
    id 'net.ltgt.errorprone' version "${errorpronePluginVersion}"
    id 'net.ltgt.nullaway' version "${nullawayPluginVersion}"
    id 'org.sonarqube' version "${sonarqubePluginVersion}"
    id 'com.gorylenko.gradle-git-properties' version "${gitPropertiesPluginVersion}"
    id 'io.github.ben-manes.versions' version "${benManesVersionsPluginVersion}"
    id 'org.openrewrite.rewrite' version "${openrewriteVersion}"
}

group = 'de.zettsystems'
version = appVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    // Identity-Baustein (de.zettsystems:identity-*) aus dem Repo zs-identity.
    // Zugang: gpr.user/gpr.key in ~/.gradle/gradle.properties (PAT mit
    // read:packages) oder GITHUB_ACTOR/GITHUB_TOKEN in der CI.
    maven {
        name = 'GitHubPackages'
        url = uri('https://maven.pkg.github.com/MichaelZett/zs-identity')
        credentials {
            username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
            password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
        }
        content {
            includeGroup 'de.zettsystems'
        }
    }
    // Lokale Iteration am Baustein: dort ./gradlew publishToMavenLocal.
    mavenLocal {
        content {
            includeGroup 'de.zettsystems'
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

springBoot {
    buildInfo()
}

// Stabiler Artefaktname für den Release-Job (build/libs/starfare.jar).
bootJar {
    archiveFileName = 'starfare.jar'
}

// Cucumber/Selenium-Smoke-Test (src/e2eTest): eigenes Source-Set, damit
// `./gradlew test` browserfrei bleibt. test.output liegt mit auf dem Pfad,
// um SyncAsyncTestConfig & Co. wiederzuverwenden; ausgeführt wird davon nichts.
sourceSets {
    e2eTest {
        java.setSrcDirs(['src/e2eTest/java'])
        resources.setSrcDirs(['src/e2eTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations.named('e2eTestImplementation') { extendsFrom configurations.testImplementation }
configurations.named('e2eTestRuntimeOnly') { extendsFrom configurations.testRuntimeOnly }
configurations.named('e2eTestCompileOnly') { extendsFrom configurations.testCompileOnly }
configurations.named('e2eTestAnnotationProcessor') { extendsFrom configurations.testAnnotationProcessor }

configurations {
    mockitoAgent
}

dependencies {
    implementation "de.zettsystems:identity-core:${identityVersion}"
    implementation "de.zettsystems:identity-vaadin:${identityVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.vaadin:vaadin-spring-boot-starter'
    developmentOnly 'com.vaadin:vaadin-dev'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly "com.github.spotbugs:spotbugs-annotations:${spotbugsVersion}"
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitJunit5Version}"
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    e2eTestImplementation "io.cucumber:cucumber-java:${cucumberVersion}"
    e2eTestImplementation "io.cucumber:cucumber-spring:${cucumberVersion}"
    e2eTestImplementation "io.cucumber:cucumber-junit-platform-engine:${cucumberVersion}"
    e2eTestImplementation 'org.junit.platform:junit-platform-suite'
    e2eTestImplementation 'org.seleniumhq.selenium:selenium-java'
    e2eTestImplementation "io.github.bonigarcia:webdrivermanager:${webdrivermanagerVersion}"

    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }

    errorprone "com.google.errorprone:error_prone_core:${errorproneVersion}"
    errorprone "com.uber.nullaway:nullaway:${nullawayVersion}"

    rewrite platform("org.openrewrite.recipe:rewrite-recipe-bom:${rewriteRecipeBomVersion}")
    rewrite "de.zettsystems:zettsystems-recipes:${zettsystemsRecipesVersion}"
    rewrite 'org.openrewrite.recipe:rewrite-migrate-java'
    rewrite 'org.openrewrite.recipe:rewrite-static-analysis'
    rewrite 'org.openrewrite.recipe:rewrite-spring'
    rewrite 'org.openrewrite.recipe:rewrite-testing-frameworks'
}

// OpenRewrite läuft nur auf Zuruf, nie als Teil von `build`:
//   ./gradlew rewriteDryRun --no-parallel --no-configuration-cache   (danach rewriteRun)
// Das Plugin verträgt weder parallele Ausführung noch den Configuration-Cache;
// die Flags gehören an den Aufruf, nicht in gradle.properties.
// Plugin bewusst auf 7.39.0 + rewrite-recipe-bom 3.37.0: 7.40.0/7.41.0 und BOM
// 3.38.0 verweisen auf ein rewrite-bom 8.91.0, das nicht in Maven Central liegt
// (Stand 2026-09-17, dort endet es bei 8.90.4).
rewrite {
    // Kuratiert: jedes Recipe lief als Dry-Run, der Diff wurde gelesen.
    activeRecipe('de.zettsystems.ZettSystemsRecipes')
    activeRecipe('org.openrewrite.staticanalysis.CodeCleanup')
    activeRecipe('org.openrewrite.java.RemoveUnusedImports')
    // CodeCleanup > HideUtilityClassConstructor hält Klassen mit nur statischen
    // Mitgliedern für Utility-Klassen und gibt ihnen einen privaten Konstruktor.
    // Diese beiden werden aber vom Framework instanziiert (Cucumber-Spring, ArchUnit).
    exclusion('src/e2eTest/java/de/zettsystems/starfare/e2e/CucumberSpringConfiguration.java')
    exclusion('src/test/java/de/zettsystems/starfare/architecture/LayerRulesTest.java')
    //
    // Geprüft und BEWUSST nicht aktiv (Befunde großteils aus zs-identity,
    // 2026-09-17; die Gründe gelten projektübergreifend):
    //  - java.migrate.UpgradeToJava25, staticanalysis.CommonStaticAnalysis,
    //    testing.assertj.JUnitToAssertj / Assertj: Migrations-Composites. Die
    //    Migration ist erledigt (7d38993 / fbb60a5); auf gepflegtem Code finden sie
    //    nichts mehr, hinterlassen aber Marker-Kommentare im Build-Skript und
    //    übersetzen assertInstanceOf(..) falsch. Nur für eine echte Migration.
    //  - java.logging.slf4j.Slf4jBestPractices: hebt LOG.debug(.., e) auf error und
    //    stellt auf die Fluent-API um. Log-Level sind Entscheidungen.
    //  - java.migrate.lang.UseTextBlocks: macht aus umbrochenen Sätzen Textblöcke
    //    mit `\` am Zeilenende.
    //  - java.migrate.lang.var.UseVarForObject: Stilfrage, keine Nachlässigkeit.
    //  - Spring Boot 4: kein `SpringBoot4BestPractices` vorhanden; der eine Befund
    //    aus spring.boot4.MigrateToModularStarters (spring-security-test ->
    //    spring-boot-starter-security-test) ist von Hand übernommen.
    //  - de.zettsystems.UseToListTrue / UseFloorMod ändern Verhalten: nur einzeln
    //    und mit gelesenem Diff.
    // Build-Skripte laufen trotz `exclusion(..)` mit; Rewrite kürzt dort
    // qualifizierte Klassennamen, ohne den Import zu ergänzen — deshalb stehen die
    // Importe von Hand am Skriptanfang.
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    finalizedBy jacocoTestReport
}

bootRun {
    jvmArgs '-Dspring.profiles.active=local'
}

tasks.matching { it.name == 'compileE2eTestJava' }.configureEach {
    options.errorprone.enabled = false
}

// Nicht Teil von `check`/`build`: braucht Chrome + Docker. Lokal
// `./gradlew e2eTest` (sichtbarer Browser: -De2e.headless=false), in der CI
// der Job `e2e`.
tasks.register('e2eTest', Test) {
    group = 'verification'
    description = 'Runs the Cucumber/Selenium smoke test against the real app.'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
    systemProperty 'e2e.headless', System.getProperty('e2e.headless', 'true')
    // Nur zur Diagnose (-De2e.lang=en-US): Die Steps erwarten die deutsche Oberfläche.
    systemProperty 'e2e.lang', System.getProperty('e2e.lang', 'de-DE')
    jacoco {
        destinationFile = layout.buildDirectory.file('jacoco/e2eTest.exec').get().asFile
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
        showCauses = true
        showExceptions = true
        showStackTraces = true
    }
    shouldRunAfter tasks.named('test')
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone.disableWarningsInGeneratedCode = true
    options.errorprone.excludedPaths = ".*/build/generated/.*"
    options.errorprone.nullaway {
        annotatedPackages.add("de.zettsystems.starfare")
        severity = CheckSeverity.ERROR
    }
}

tasks.named('compileTestJava').configure {
    options.errorprone.enabled = false
}

spotbugs {
    toolVersion = spotbugsVersion
    effort = Effort.MAX
    reportLevel = Confidence.valueOf('LOW')
    excludeFilter = file('config/spotbugs/exclude.xml')
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.file('reports/spotbugs/main.html')
        }
        sarif {
            required = true
            outputLocation = layout.buildDirectory.file('reports/spotbugs/main.sarif')
        }
        xml.required = false
    }
}

tasks.named('spotbugsTest').configure { enabled = false }
tasks.named('spotbugsE2eTest').configure { enabled = false }

// `./gradlew dependencyUpdates` defaults to stable releases only and skips
// major version bumps. Override per invocation:
//   -Punstable   include RC / M* / Beta / Alpha candidates
//   -Pmajor      include major version bumps
def depUpdateIsUnstable = { String version ->
    def stableKeywords = ['RELEASE', 'FINAL', 'GA']
    def stable = stableKeywords.any { version.toUpperCase(Locale.ROOT).contains(it) }
    def numericLooking = version ==~ /^[0-9,.v-]+(-r)?$/
    return !stable && !numericLooking
}
def depUpdateIsMajorBump = { String current, String candidate ->
    def cur = current.split(/[.\-]/, 2)[0]
    def cand = candidate.split(/[.\-]/, 2)[0]
    return cur.isInteger() && cand.isInteger() && cand.toInteger() > cur.toInteger()
}
dependencyUpdates {
    rejectVersionIf { selection ->
        def allowUnstable = project.hasProperty('unstable')
        def allowMajor = project.hasProperty('major')
        if (!allowUnstable
                && depUpdateIsUnstable(selection.candidate.version)
                && !depUpdateIsUnstable(selection.currentVersion)) {
            return true
        }
        if (!allowMajor
                && depUpdateIsMajorBump(selection.currentVersion, selection.candidate.version)) {
            return true
        }
        return false
    }
}

jacoco {
    toolVersion = jacocoVersion
}

def jacocoExclusions = [
        'de/zettsystems/starfare/StarfareApplication.class',
        'de/zettsystems/starfare/AppShell.class',
        '**/ui/**',
        '**/config/**',
        '**/*Entity.class',
        '**/*Repository.class',
        '**/package-info.class',
]

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.78
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

sonar {
    properties {
        // Sonar Gradle plugin does not auto-read gradle.properties; pipe through explicitly.
        def sonarTokenValue = findProperty('sonar.token') ?: System.getenv('SONAR_TOKEN')
        if (sonarTokenValue) {
            property 'sonar.token', sonarTokenValue
        }
        property 'sonar.projectKey', 'starfare'
        property 'sonar.projectName', 'Starfare'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://localhost:9000'
        // Include authored frontend files and the custom browser-test source set.
        property 'sonar.sources', 'src/main'
        property 'sonar.tests', 'src/test,src/e2eTest'
        property 'sonar.java.test.binaries', files(sourceSets.test.output.classesDirs, sourceSets.e2eTest.output.classesDirs)
        property 'sonar.java.test.libraries', sourceSets.e2eTest.runtimeClasspath.files
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.exclusions', 'src/main/frontend/generated/**,build/generated/**'
        // Mirrors jacocoExclusions so Sonar's coverage % matches the Jacoco bundle %.
        // Coverage-only — these classes still get analyzed for bugs/smells.
        property 'sonar.coverage.exclusions', [
                'src/main/java/de/zettsystems/starfare/StarfareApplication.java',
                'src/main/java/de/zettsystems/starfare/AppShell.java',
                '**/ui/**/*',
                '**/config/**/*',
                '**/*Entity.java',
                '**/*Repository.java',
                '**/package-info.java',
        ].join(',')

        property 'sonar.issue.ignore.multicriteria', 'serial1,serial2,serial3,domainEquals'
        property 'sonar.issue.ignore.multicriteria.serial1.ruleKey', 'java:S1948'
        property 'sonar.issue.ignore.multicriteria.serial1.resourceKey', '**/*.java'
        property 'sonar.issue.ignore.multicriteria.serial2.ruleKey', 'java:S2057'
        property 'sonar.issue.ignore.multicriteria.serial2.resourceKey', '**/*.java'
        property 'sonar.issue.ignore.multicriteria.serial3.ruleKey', 'java:S4926'
        property 'sonar.issue.ignore.multicriteria.serial3.resourceKey', '**/*.java'
        // JPA entities deliberately inherit equals/hashCode from AbstractBaseEntity.
        property 'sonar.issue.ignore.multicriteria.domainEquals.ruleKey', 'java:S2160'
        property 'sonar.issue.ignore.multicriteria.domainEquals.resourceKey', '**/domain/**'
    }
}
tasks.named('sonar').configure { dependsOn jacocoTestReport, tasks.named('compileE2eTestJava') }

# CI + Release + Deploy (hetzner-zs, Coolify).
#
# Push auf main:
#   build + e2e (parallel)
#   -> release (nur wenn appVersion in gradle.properties NICHT auf -SNAPSHOT
#      endet: Tag v<version> + GitHub-Release mit starfare.jar) — VOR dem
#      Deploy, damit jede deployte Version rollbar ist
#      -> docker (Image nach GHCR: latest + v<version> + sha, dann Coolify-Webhook)
#         -> bump_version (appVersion auf nächstes Patch-SNAPSHOT, [skip ci])
#
# SNAPSHOT-Pushes bauen und testen nur. Nach einem Release steht main wieder
# auf -SNAPSHOT; vor dem Weiterarbeiten einmal `git pull`.
#
# Manuell (workflow_dispatch): Rollback — retaggt das Image v<version> in GHCR
# als latest (ohne Rebuild) und stößt den Coolify-Webhook an.
# Deploy-Secrets: COOLIFY_WEBHOOK_URL, COOLIFY_API_TOKEN.
#
# SonarCloud: Secret SONAR_TOKEN. Die Organisationskennung ist der stabile
# technische Schlüssel aus SonarCloud, nicht der Anzeigename der Organisation.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rollback_version:
        description: "Rollback: bereits releaste Version, z. B. 0.1.0 (Image-Tag v<version> wird wieder latest)"
        required: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  IMAGE: ghcr.io/michaelzett/starfare

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Release-Läufe nie mittendrin abbrechen (Tag ohne Release wäre die Folge);
  # nur PR-Läufe verdrängen einander.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.app_version.outputs.value }}
      is_snapshot: ${{ steps.app_version.outputs.is_snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar braucht die Historie, sonst gilt jede Zeile als neu.
          fetch-depth: 0

      - name: Read app version
        id: app_version
        run: |
          APP_VERSION="$(grep '^appVersion=' gradle.properties | cut -d'=' -f2)"
          if [ -z "$APP_VERSION" ]; then
            echo "appVersion fehlt in gradle.properties"
            exit 1
          fi
          echo "value=$APP_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$APP_VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Node bringt der Runner mit, die Tests brauchen keine npm-Pakete. Das
      # Muster löst die Shell auf, neue Testdateien laufen dadurch automatisch mit.
      - name: Frontend unit tests
        run: node --test src/test/frontend/*.test.mjs

      - name: Build and test
        run: ./gradlew --no-daemon build

      # Nutzt, was der Build erzeugt hat (Klassen, Testergebnisse, JaCoCo-XML).
      # compileE2eTestJava, weil sonar.java.test.binaries auch das
      # e2e-Source-Set nennt und `build` es nicht kompiliert.
      - name: Analyse with SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: ./gradlew --no-daemon compileE2eTestJava sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: michaelzett

      # Nur bei Fehlschlag: Im Erfolgsfall stehen die Ergebnisse ohnehin als
      # Check-Annotation und Coverage-Kommentar da; das Artefakt lag sonst
      # 90 Tage herum (Default-Aufbewahrung), ohne je geöffnet zu werden.
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

      # Übergabe an den release-Job — kein zweiter Gradle-Build.
      - name: Upload boot jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app_version.outputs.is_snapshot == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: boot-jar
          path: build/libs/starfare.jar
          retention-days: 1

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d  # v6.6.1
        with:
          report_paths: 'build/test-results/test/*.xml'
          detailed_summary: true
          include_passed: false

      - name: JaCoCo coverage report
        if: github.event_name == 'pull_request' && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != ''
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920  # v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 78
          min-coverage-changed-files: 60
          title: Coverage Report

  # Cucumber/Selenium-Smoke: Ubuntu-Runner bringen Chrome und Docker mit —
  # genau was SharedBrowser (Headless-Chrome) und Testcontainers brauchen.
  # Opt-out per Commit-Marker; Pull-Request-Events haben kein head_commit,
  # der contains-Ausdruck ist dann leer und der Job läuft — gewollt.
  e2e:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      && !contains(github.event.head_commit.message, '[skip e2e]')
      && !contains(github.event.head_commit.message, '[skip-e2e]')
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Smoke test
        run: ./gradlew --no-daemon e2eTest

      - name: Publish smoke results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d  # v6.6.1
        with:
          report_paths: 'build/test-results/e2eTest/*.xml'
          check_name: Smoke Test Report
          detailed_summary: true
          include_passed: false

      # Die Suite schreibt bei Szenario-Fehlschlägen Seitentext und Screenshot
      # nach build/e2e-failures/; der Seitentext steht außerdem im stderr der
      # JUnit-XML unter build/test-results/e2eTest/.
      - name: Upload e2e failure dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures
          path: |
            build/e2e-failures/
            build/test-results/e2eTest/
            build/reports/tests/e2eTest/
          if-no-files-found: ignore
          retention-days: 3

  # GitHub-Release mit Tag v<version>; Release-Body = CHANGELOG-Abschnitt.
  # Ein per [skip e2e] übersprungener Smoke blockiert das Release nicht.
  release:
    runs-on: ubuntu-latest
    needs: [ build, e2e ]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
      && needs.build.outputs.is_snapshot == 'false'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: boot-jar
          path: build/libs/

      - name: Prepare release body from changelog
        env:
          APP_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          awk -v version="$APP_VERSION" '
            $0 ~ "^##[[:space:]]+" version "([[:space:]]+-.*)?$" { found=1; print; next }
            found && /^##[[:space:]]+/ { exit }
            found { print }
          ' CHANGELOG.md > changelog-entry.md

          if ! grep -q '^## ' changelog-entry.md; then
            echo "Kein Changelog-Eintrag für Version $APP_VERSION in CHANGELOG.md"
            exit 1
          fi

          {
            echo "## Changelog"
            echo
            cat changelog-entry.md
            echo
            echo "## Build Info"
            echo "- Commit: ${{ github.sha }}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # Fine-grained PAT (Repo-Secret RELEASE_TOKEN, Contents: read/write),
          # falls "Workflow permissions" dem GITHUB_TOKEN das Release verwehrt.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ needs.build.outputs.app_version }}
          name: v${{ needs.build.outputs.app_version }}
          body_path: release-body.md
          generate_release_notes: true
          files: build/libs/starfare.jar

  # Release-Image nach GHCR und Deploy über den Coolify-Webhook. Explizite
  # Bedingung, weil needs Skips transitiv vererbt (übersprungener e2e-Job).
  docker:
    runs-on: ubuntu-latest
    needs: [ build, release ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.release.result == 'success' }}
    permissions:
      contents: read
      packages: write
      deployments: write
    # Job-Env, weil der secrets-Kontext in Step-if nicht verfügbar ist.
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: boot-jar
          path: build/libs/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # latest zieht Coolify; v<version> bleibt für den Rollback liegen.
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.build.outputs.app_version }}
            type=sha

      - uses: docker/build-push-action@v7
        # Kein Build-Record-Artefakt (90 Tage Default-Aufbewahrung).
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keine Attestationen: sonst je Release zwei untagged GHCR-Versionen.
          provenance: false
          sbom: false

      - name: Create GitHub deployment
        id: gh_deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id=$(jq -n \
            --arg ref "${{ github.sha }}" \
            --arg version "v$APP_VERSION" \
            '{ref: $ref, environment: "Hetzner", auto_merge: false, required_contexts: [], description: ("Coolify-Deploy " + $version)}' \
            | gh api "repos/${{ github.repository }}/deployments" --input - --jq .id)
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"

      # POST, nicht GET: Coolify 4.3 lehnt GET am Deploy-Endpunkt ab.
      - name: Trigger Coolify deploy
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN"
          "$COOLIFY_WEBHOOK_URL"

      - name: Mark GitHub deployment successful
        if: ${{ success() && steps.gh_deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deployment.outputs.id }}/statuses" \
            -f state=success \
            -f environment_url="https://starfare.zettsystems.de" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark GitHub deployment failed
        if: ${{ failure() && steps.gh_deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deployment.outputs.id }}/statuses" \
            -f state=failure \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Nach dem Deploy: appVersion auf nächstes Patch-SNAPSHOT heben, damit
  # Folge-Pushes nicht erneut releasen. [skip ci] -> kein weiterer Lauf.
  bump_version:
    runs-on: ubuntu-latest
    needs: [ docker ]
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Bump appVersion to next patch SNAPSHOT
        run: |
          CURRENT="$(grep '^appVersion=' gradle.properties | cut -d'=' -f2)"
          if [[ "$CURRENT" == *-SNAPSHOT ]]; then
            echo "appVersion ist bereits SNAPSHOT ($CURRENT) -> kein Bump nötig."
            exit 0
          fi
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unerwartetes Versionsformat für Auto-Bump: $CURRENT"
            exit 1
          fi
          MAJOR="$(echo "$CURRENT" | cut -d. -f1)"
          MINOR="$(echo "$CURRENT" | cut -d. -f2)"
          PATCH="$(echo "$CURRENT" | cut -d. -f3)"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))-SNAPSHOT"
          echo "Bump appVersion: $CURRENT -> $NEXT"
          sed -i "s/^appVersion=.*/appVersion=${NEXT}/" gradle.properties
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -am "Bump appVersion to ${NEXT} [skip ci]"
          git push origin HEAD:main

  # Manueller Rollback: Image v<version> ohne Rebuild wieder als latest taggen,
  # dann zieht Coolify es über den Webhook.
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      deployments: write
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      ROLLBACK_VERSION: ${{ inputs.rollback_version }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag v${{ inputs.rollback_version }} as latest
        run: |
          if ! docker buildx imagetools inspect "${IMAGE}:v${ROLLBACK_VERSION}" > /dev/null; then
            echo "Image-Tag v${ROLLBACK_VERSION} existiert nicht in GHCR — nur releaste Versionen sind rollbar."
            exit 1
          fi
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:v${ROLLBACK_VERSION}"

      - name: Create GitHub deployment
        id: gh_deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id=$(jq -n \
            --arg ref "v${ROLLBACK_VERSION}" \
            '{ref: $ref, environment: "Hetzner", auto_merge: false, required_contexts: [], description: ("Rollback auf " + $ref)}' \
            | gh api "repos/${{ github.repository }}/deployments" --input - --jq .id)
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deploy
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN"
          "$COOLIFY_WEBHOOK_URL"

      - name: Mark GitHub deployment successful
        if: ${{ success() && steps.gh_deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deployment.outputs.id }}/statuses" \
            -f state=success \
            -f environment_url="https://starfare.zettsystems.de" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Mark GitHub deployment failed
        if: ${{ failure() && steps.gh_deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deployment.outputs.id }}/statuses" \
            -f state=failure \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
